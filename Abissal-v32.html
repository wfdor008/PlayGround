const LOOK_PAT=['manchas','calotas','crateras','listras','tempestade','veios','cristas','nuvens','dunas','espiral','gotas','fendas'];
function lookFeats(p,cap,band){const L=p.look,rg=mulberry(hstr('look|'+p.name)),W=[1,1,1],K=[0,0,0];
 const LT=vHex(vTint(p.c2,40,.5)).map(v=>v/255),DK=vHex(vTint(p.c1,0,.5)).map(v=>v/255);
 for(const idx of L){const pat=LOOK_PAT[idx];
  if(pat==='manchas'){for(let i=0;i<8;i++)cap(rg()*6.283,(rg()*2-1)*1.1,.05+rg()*.07,DK,.35)}
  else if(pat==='calotas'){for(const sg of[-1,1])for(let i=0;i<6;i++)cap(i*1.047,sg*(1.0+rg()*.1),.3+rg()*.1,W,.45)}
  else if(pat==='crateras'){for(let i=0;i<10;i++){const lon=rg()*6.283,lat=(rg()*2-1)*1.1;cap(lon,lat,.03+rg()*.03,DK,.4);cap(lon-.01,lat-.01,.015,LT,.3)}}
  else if(pat==='listras'){for(let i=0;i<6;i++){const y=-.9+i*.36;band(y,y+.12,i%2?LT:DK,.18)}}
  else if(pat==='tempestade'){const lon=rg()*6.283,lat=.2+rg()*.2;cap(lon,lat,.22,LT,.5);cap(lon,lat,.1,DK,.5)}
  else if(pat==='veios'){for(let i=0;i<14;i++)cap(rg()*6.283,(rg()*2-1)*1.2,.02,LT,.6)}
  else if(pat==='cristas'){for(let i=0;i<10;i++)cap(rg()*6.283,(rg()*2-1)*1.1,.015,W,.5)}
  else if(pat==='nuvens'){for(let i=0;i<10;i++)cap(rg()*6.283,(rg()*2-1)*1.0,.25,W,.14)}
  else if(pat==='dunas'){for(let i=0;i<14;i++){const y=-.95+i*.13;band(y,y+.02,DK,.25)}}
  else if(pat==='espiral'){for(let i=0;i<16;i++)cap(i*.4,Math.sin(i*.3)*.4,.03,LT,.4)}

 }

 for(let i=0;i<60;i++)cap(rg()*6.283,(rg()*2-1)*1.3,.006+rg()*.009,rg()<.5?DK:LT,.22)}
function lookOverlay2D(p,cx,cy,R){const rr=mulberry(hstr(UNIVERSE+'pt|'+p.name));const spin=(.05+rr()*.12)*(rr()<.5?1:-1),rot=performance.now()/1000*spin+rr()*6.283;

 for(const f of F){const col=`rgba(${f.c[0]*255|0},${f.c[1]*255|0},${f.c[2]*255|0},${f.a})`;
  if(f.k===0){const q=at(f.lon,f.lat);if(q.f<-.2)continue;g.fillStyle=col;g.beginPath();g.ellipse(q.x,q.y,Math.max(1,f.rad*R*Math.max(.25,q.f+.5)),Math.max(1,f.rad*R),0,0,6.283);g.fill()}
  else{g.fillStyle=col;g.fillRect(cx-R,cy+f.y0*R,2*R,Math.max(1,(f.y1-f.y0)*R))}}
 const lim=g.createRadialGradient(cx-R*.35,cy-R*.35,R*.35,cx,cy,R);lim.addColorStop(0,'rgba(0,0,0,0)');lim.addColorStop(1,'rgba(0,0,0,.42)');g.fillStyle=lim;g.fillRect(cx-R,cy-R,2*R,2*R);
 g.restore()}

let AC=null,MASTER=null,AMB=null,MUS=null,MUSTIMER=null,ALARM=null;
/* cadeia de áudio: mixagem -> compressor -> saída. O compressor evita estouro quando tiro, explosão,
   criatura e música tocam juntos; o ganho final continua sendo o volume do jogador. */
function audioOn(){if(AC)return AC;AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=CFG.vol/100;
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-15;comp.knee.value=22;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.22;
 const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=28;
 MASTER.connect(hp);hp.connect(comp);comp.connect(AC.destination);return AC}
function env(g,t,a,d,peak){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}return b}
/* o navegador só libera o som após um gesto do jogador: o primeiro toque, clique ou tecla cria o áudio */
function unlockAudio(){try{audioOn();if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));

/* soma dos bônus equipados para uma categoria; só vale em naves com PC; limite 500% */

function modCurve(t){t=Math.min(MOD_RAW_MAX,t);const e=t<=1?t:1+(t-1)*.5;return Math.min(MOD_MAX,e)}

function hexRGB(h){const n=parseInt(h.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]}
function pcGLStart(){const cv=document.getElementById('pcGL');if(!cv)return;let gl=null;try{gl=cv.getContext('webgl')||cv.getContext('experimental-webgl')}catch(e){}

  const t=performance.now()/1000,asp=w/Math.max(1,h);

function misMakeRaw(type,from,rnd){const k=from==='alien'?1.5:1;const id=Math.random().toString(36).slice(2,8);const nv=MISS_NOVAS.filter(x=>x.type===type);if(nv.length){const e=nv[Math.floor(rnd()*nv.length)];return{id,type,need:e.need,have:0,from,cr:Math.round(e.cr*k),peca:e.peca||null,t:e.t,lore:e.t}}
 if(type==='bicho'){const need=3+Math.floor(rnd()*4);return{id,type,need,have:0,from,cr:Math.round(120*need*k),t:`Eliminar ${need} bichos em planetas secos`}}
 if(type==='minerio'){const need=40+Math.floor(rnd()*41);return{id,type,need,have:0,from,cr:Math.round(need*2.5*k),t:`Coletar ${need} minérios (metal, raros, plasma ou cristal)`}}
 if(type==='caca_pirata'){const need=3+Math.floor(rnd()*3);return{id,type,need,have:0,from,cr:Math.round(500*need*k),t:`Derrotar ${need} piratas espaciais no espaço (eles aparecem ao acaso)`}}
 if(type==='caca_gigante'){return{id,type,need:1,have:0,from,cr:Math.round(6000*k),t:'Derrotar um pirata gigante no espaço (muito raro, aparece ao acaso)'}}
 if(type==='titan'){const need=1+Math.floor(rnd()*2);return{id,type,need,have:0,from,cr:Math.round(MIS_VAL.titanCr*need*k),t:`Derrotar ${need} titã${need>1?'s':''} gigante${need>1?'s':''} em planetas secos`}}
 if(type==='voador'){const need=4+Math.floor(rnd()*4);return{id,type,need,have:0,from,cr:Math.round(MIS_VAL.voadorCr*need*k),t:`Abater ${need} voadores em planetas secos`}}
 if(type==='dourado'){return{id,type,need:1,have:0,from,cr:Math.round(MIS_VAL.douradoCr*k),t:'Escanear 1 bicho dourado (mutante) em planeta seco'}}
 if(type==='hibrido'){const need=1+Math.floor(rnd()*2);return{id,type,need,have:0,from,cr:Math.round(MIS_VAL.hibridoCr*need*k),t:`Derrotar ${need} bicho${need>1?'s':''} híbrido${need>1?'s':''} (fundido)`}}
 if(type==='pouso'){const need=2+Math.floor(rnd()*3);return{id,type,need,have:0,from,cr:Math.round(300*need*k),t:`Pousar em ${need} planetas diferentes`}}
 if(type==='setor'){const need=3+Math.floor(rnd()*3);return{id,type,need,have:0,from,cr:Math.round(150*need*k),t:`Visitar ${need} setores diferentes (cada chegada conta)`}}
 if(type==='resgate')return{id,type,need:1,have:0,from,cr:Math.round(RES_CR*k),t:'Resgatar um alienígena preso num planeta alienígena próximo e levá-lo à base'};
 return{id,type:'monstro',need:1,have:0,from,cr:Math.round(500*k),t:'Derrotar o leviatã espacial: ele surge assim que você entrar num campo de meteoritos'}}

const BASE_CELL={x:0,y:0},BASE_RANGE=2;
const FREE_FUEL=.4;/* % de combustível por segundo no voo livre */
/* valores de referência das missões (ajustáveis) */
const MIS_VAL={titanCr:650,voadorCr:90,douradoCr:900,hibridoCr:350,principalCr:3000};
function misMainMake(){return{id:'principal',type:'principal',main:true,cat:'principal',title:'Caçada ao leviatã',lore:MIS_LORE.principal,need:1,have:0,from:'base',cr:MIS_VAL.principalCr,t:'Caçar o leviatã que ronda a Base Âncora: ele surge quando você voa a até 2 setores da base'}}
/* missão rara: paga bem mais e dá um item bom (mod de qualidade alta ou recurso raro) */
function misRare(m){m.rare=true;m.cr=Math.round(m.cr*3)+400;m.item=Math.random()<.5?{tipo:'mod',q:14+Math.floor(Math.random()*7)}:{tipo:'res',res:['raro','plasma','cristal'][Math.floor(Math.random()*3)],n:20+Math.floor(Math.random()*31)};return m}
function misNew(){const pool=MIS_POOL;let m=misMake(pool[Math.floor(Math.random()*pool.length)],'base',Math.random);
 /* peças únicas ainda não obtidas aparecem com frequência no quadro, para o jogador encontrá-las */
 const pend=MISS_NOVAS.filter(x=>x.peca&&!(S.pieces&&S.pieces[x.peca]));
 if(pend.length&&Math.random()<.3){const e=pend[Math.floor(Math.random()*pend.length)];m=misMake(e.type,'base',Math.random);m.need=e.need;m.cr=e.cr;m.peca=e.peca;m.t=e.t;m.lore=e.t}
 if(Math.random()<.2)misRare(m);return m}
function itemText(it){return it.tipo==='mod'?'modificação Q'+it.q+' (alta qualidade)':it.n+' de '+(it.res==='cristal'?'cristal':it.res)}
function misBoard(){const ms=misState();if(!ms.board){ms.board=[0,1,2].map(()=>misNew())}return ms.board}
function misLine(){const a=misState().active[0];return a?' · MISSÃO '+a.have+'/'+a.need:''}
/* ---- missão de resgate: alienígena preso num planeta alienígena; ele segue o jogador, entra na cápsula, vai à base ---- */
function resgateTarget(){const cx=S.cell?S.cell.x:0,cy=S.cell?S.cell.y:0,cand=[];
 for(let dx=-8;dx<=8;dx++)for(let dy=-8;dy<=8;dy++){const x=cx+dx,y=cy+dy,sy=sysAt(x,y);if(!sy||!sy.planets)continue;
  for(const p of sy.planets){if(p.ocean||/gasos|gigante/.test(p.type||''))continue;if((hstr(UNIVERSE+'|'+p.name)|0)%3===0)cand.push({name:p.name,cx:x,cy:y,d:Math.hypot(dx,dy)})}}
 cand.sort((a,b)=>a.d-b.d);return cand[0]||null}
/* prisioneiro visível só no planeta da missão (e no setor certo), até ser libertado */
function captiveObj(){const u=S.under;if(!u||S.resc||S.env!=='seco'||!S.planet||!S.cell)return null;
 const m=(misState().active||[]).find(x=>x.type==='resgate'&&x.target&&x.target.name===S.planet.name&&x.target.cx===S.cell.x&&x.target.cy===S.cell.y);if(!m)return null;
 if(!m.cap)m.cap={x:u.x+16,z:u.z-10};
 return{k:'cativo',x:m.cap.x,z:m.cap.z,y:floorY(m.cap.x,m.cap.z),gone:false,m}}
function freeCaptive(){const cp=captiveObj();if(!cp)return;const m=cp.m,u=S.under;
 const px=u.x-4,pz=u.z;S.resc={mid:m.id,name:m.capName||'Alienígena',ch:m.ch,status:'companion',pos:{x:px,y:floorY(px,pz),z:pz}};
 sfx('clique');msg('"Obrigado! Não me deixe aqui." O alienígena agora te segue.',3600,true)}
function resgateMarkFlight(){const m=(misState().active||[]).find(x=>x.type==='resgate'&&x.target);if(!m||!S.cell)return null;const sy=sysAt(m.target.cx,m.target.cy);if(!sy)return null;const pl=sy.planets.find(q=>q.name===m.target.name);return pl?planetWorld(sy,pl):null}
function resgateTalk(name,first){const say=t=>panel(`<h2>${String(name).toUpperCase()}</h2><p>${t}</p>`,[
 ['Perguntar sobre o planeta',()=>say('"Os cientistas de lá nos prenderam para estudar a nossa energia. Eu fiquei muito tempo numa cela de vidro."')],
 ['Perguntar sobre a cápsula',()=>say('"Essa cápsula é a única coisa que consegui manter inteira. Ela aguenta a descida e o vácuo."')],
 ['Perguntar sobre a base',()=>say('"Eu ouvi falar da base Âncora. Dizem que ela recebe quem vem em paz, e aqui parece seguro."')],
 ['Perguntar seu nome',()=>say('"Meu nome é '+name+'. Antes de ser capturado, eu cuidava das colheitas da minha aldeia."')],
 ['Fechar',closePanel]]);say(first)}

let FRIEND_REF=null;
function friendSchedule(){S.resgFriend.nextAt=(S.t||0)+240+Math.random()*240}
function friendGift(o){if(!o||o.gifted)return;o.gifted=true;const r=Math.random();
 if(r<.4){const pk=Math.random()<.35?['metal',3,6]:Math.random()<.5?['poeira',2,4]:Math.random()<.5?['raro',1,2]:Math.random()<.5?['plasma',1,2]:['cristal',1,1];
  const n=pk[1]+Math.floor(Math.random()*(pk[2]-pk[1]+1));if(pk[0]==='cristal')S.crystal=(S.crystal||0)+n;else S.inv[pk[0]]=(S.inv[pk[0]]||0)+n;msg(o.n+' te deu um presente: +'+n+' '+pk[0],3400,true)}
 else if(r<.7){const c=150+Math.floor(Math.random()*251);S.credits=(S.credits||0)+c;msg(o.n+' te deu um presente: +'+c+' créditos',3400,true)}
 else{const md=makeMod();md.q=8+Math.floor(Math.random()*7);pcState();S.mods.push(md);msg(o.n+' te deu um presente: um módulo de qualidade '+md.q,3400,true)}
 sfx('coleta')}
function friendArrive(){const F=S.resgFriend;if(!F)return;const L=S.hubShips=S.hubShips||[];
 const used=new Set(L.filter(e=>e.st!=='lift').map(e=>e.pad.x));const pad=HUB_VPADS.find(q=>!used.has(q.x))||HUB_VPADS[0];
 const o={id:'resg'+Math.random().toString(36).slice(2,7),n:F.name||'Resgatado',role:'AMIGO RESGATADO · ALIENÍGENA',visitor:true,friend:true,x:pad.x,z:pad.z,phase:'arrive',wp:[{x:0,z:300},{x:-57+Math.random()*113,z:35+Math.random()*35}],line:'Passei para ver vocês.',yaw:0,nextSay:0,ch:F.ch};
 o.open=()=>{friendGift(o);resgateTalk(o.n,'"Passei para ver vocês. Você sempre me tratou bem."')};
 L.push({pad,x:pad.x,z:pad.z,y:-230,st:'descend',ship:{base:S.ship?S.ship.base:SHIPS[0],color:0,accent:1},o});
 FRIEND_REF=o;F.here=true;msg(o.n+' está chegando à base.',3000)}
function updFriend(){const F=S.resgFriend;if(!F)return;
 if(F.here){const alive=!!FRIEND_REF&&!FRIEND_REF.gone;
  if(!alive){F.here=false;friendSchedule();return}
  if(FRIEND_REF.phase&&!FRIEND_REF.gifted&&S.hub&&Math.hypot(FRIEND_REF.x-S.hub.x,FRIEND_REF.z-S.hub.z)<30)friendGift(FRIEND_REF);
  return}
 if(!F.nextAt)friendSchedule();
 if(F.nextAt>1e11)friendSchedule();/* saves antigos usavam relógio real */
 if(S.scene==='hub'&&(S.t||0)>=F.nextAt)friendArrive()}
/* entrega: missão concluída; o alienígena desce da nave e passa a ser amigo da base */
function resgateEntrega(){const R=S.resc;if(!R||R.status!=='aboard')return;R.status='delivered';
 const m=(misState().active||[]).find(x=>x.id===R.mid);if(m)misComplete(m);
 S.resgFriend={name:R.name||'Resgatado',ch:R.ch,here:false,nextAt:0};
 S.resc=null;friendArrive();sfx('coleta')}

   for(const L of f.levs||[]){const q=Math.hypot(L.p[0]-P.p[0],L.p[1]-P.p[1],L.p[2]-P.p[2]);if(q<bd){bd=q;best={k:'levi',o:L}}}

   for(const po of f.police||[]){const q=Math.hypot(po.p[0]-P.p[0],po.p[1]-P.p[1],po.p[2]-P.p[2]);if(q<bd){bd=q;best={k:'police',o:po}}}

    if(best.k==='expl'){o.hp=(o.hp??o.max??60)-(P.dmg||30);o.flash=S.t;if(o.hp<=0){o.life=0;msg('Explorador aliado destruído por pirata.',2600)}}

 f.enemies.push({p:[f.p[0]+Math.cos(a)*dist,f.p[1]+(Math.random()-.5)*60,f.p[2]+Math.sin(a)*dist],v:[0,0,0],hp:ENEMY_V[vi].hp,fire:1.5+Math.random()*2,dead:false,variant:vi})}
/* mundos vizinhos visíveis durante o voo manual: podem ser visitados em vez do destino */
function buildWorlds(f,tgt){
 /* planetas próximos da nave (alcançáveis), sem sobreposição entre si nem com o destino */
 const MAXR=1400,cand=[];
 for(let i=S.cell.x-5;i<=S.cell.x+5;i++)for(let j=S.cell.y-5;j<=S.cell.y+5;j++){
  if(i===tgt.x&&j===tgt.y)continue;const sy=sysAt(i,j);if(!sy)continue;
  for(const p of sy.planets){const pos=planetWorld(sy,p),d=Math.hypot(pos[0],pos[1],pos[2]);
   if(d>MAXR||d<200)continue;cand.push({sy,star:[(i-S.cell.x)*FK,0,(j-S.cell.y)*FK],p,pos,d})}}
 cand.sort((x,y)=>x.d-y.d);
 const acc=[];
 for(const c of cand){
  if(acc.length>=8)break;
  if(f.planet&&Math.hypot(c.pos[0]-f.T[0],c.pos[1]-f.T[1],c.pos[2]-f.T[2])<PR(f.planet)+PR(c.p)+160)continue;
  if(acc.some(o=>Math.hypot(c.pos[0]-o.pos[0],c.pos[1]-o.pos[1],c.pos[2]-o.pos[2])<PR(c.p)+PR(o.p)+160))continue;
  acc.push(c)}
 const W=[];
 for(const c of acc){let w=W.find(x=>x.sys===c.sy);if(!w){w={sys:c.sy,star:c.star,planets:[]};W.push(w)}
  w.planets.push({p:c.p,pos:c.pos,name:c.p.name})}
 return W
}
function collectWorlds(f,C,P,fo){const items=[];const list=(f.worlds||[]).map(w=>({w,d:Math.hypot(w.star[0]-f.p[0],w.star[1]-f.p[1],w.star[2]-f.p[2])})).sort((a,b)=>a.d-b.d).slice(0,12);
 for(const{w}of list){const q=fproj(C,P,w.star,fo);if(q&&q.z<5000){items.push({z:q.z,fn:()=>{const r=Math.max(2,isBH(w.sys)?fo*BH_R/q.z:fo*w.sys.size*2.2/q.z*.6);drawStar(w.sys,q.x,q.y,r,5)}})}
  for(const pl of w.planets){const pq=fproj(C,P,pl.pos,fo);if(!pq||pq.z>5000)continue;const pr=fo*PR(pl.p)/pq.z;if(pr<2)continue;
   items.push({z:pq.z,fn:()=>{paintPlanet(pl.p,pq.x,pq.y,pr);if(pq.z<1400){g.font='11px Trebuchet MS';g.fillStyle='rgba(190,240,255,.85)';g.textAlign='center';g.fillText(pl.name,pq.x,pq.y-pr-8);g.textAlign='left'}}})}}
 return items}
/* ---------- DESCIDA MANUAL ----------

   pousa e entra no ambiente. Com velocidade alta, bate e quica. */
const ENTRY_SPD=22;
/* bases galácticas no voo: cada uma fica numa posição fixa, em órbita da estrela da sua célula (como os planetas) */
function buildBases(worlds){const out=[],pls=[];for(const w of worlds||[])for(const pl of w.planets)pls.push(pl);
 for(const o of outposts()){const dx=o.cell.x-S.cell.x,dy=o.cell.y-S.cell.y;if(Math.abs(dx)>5||Math.abs(dy)>5)continue;
  const sx=dx*FK,sz=dy*FK;let best=null;
  /* primeiro tenta o ponto exato da base; a base nunca fica dentro de um planeta do voo (folga de 120) */
  const exato=[(o.cell.x+o.off.x-S.cell.x)*FK,0,(o.cell.y+o.off.y-S.cell.y)*FK];
  if(pls.every(pl=>Math.hypot(pl.pos[0]-exato[0],pl.pos[1]-exato[1],pl.pos[2]-exato[2])>=PR(pl.p)+120))best={o,pos:exato};
  for(let t=0;t<60&&!best;t++){const r=mulberry(hstr('base3d|'+UNIVERSE+'|'+o.id+'|'+t)),a=r()*6.283,R=260+r()*160,pos=[sx+Math.cos(a)*R,0,sz+Math.sin(a)*R];
   if(pls.every(pl=>Math.hypot(pl.pos[0]-pos[0],pl.pos[1]-pos[1],pl.pos[2]-pos[2])>=PR(pl.p)+120))best={o,pos}}
  if(best)out.push(best)}
 return out}
/* encostar devagar numa base galáctica pousa nela (reabastece); rápido demais, a nave quica */
function checkNearBases(f){const bs=f.bases||[];let near=null;
 for(const b of bs){const d=Math.hypot(b.pos[0]-f.p[0],b.pos[1]-f.p[1],b.pos[2]-f.p[2]);if(d<500&&(!near||d<near.d))near={d,b}}
 if(near){if(f.hintB!==near.b.o.id){f.hintB=near.b.o.id;msg(near.b.o.nome+': encoste devagar (S freia) para pousar na base.',2800)}}
 else f.hintB=null;
 f.armB=f.armB||{};
 for(const b of bs){const R=70,dx=f.p[0]-b.pos[0],dy=f.p[1]-b.pos[1],dz=f.p[2]-b.pos[2],d=Math.hypot(dx,dy,dz);
  /* a base só recebe a nave depois que ela se afasta (150 u): quem começa o voo perto não pousa sem querer */
  if(d>=150)f.armB[b.o.id]=true;
  if(d<R&&f.armB[b.o.id]){const sp=Math.hypot(f.v[0],f.v[1],f.v[2]);
   if(sp<=ENTRY_SPD){dockBase(f,b.o);return}
   const k=R/Math.max(d,1e-3);f.p=[b.pos[0]+dx*k,b.pos[1]+dy*k,b.pos[2]+dz*k];
   if(f.bumpB!==b.o.id){f.bumpB=b.o.id;msg('Muito rápido para pousar em '+b.o.nome+': freie (S).',2600)}}}}

function checkNearWorlds(f){
 let near=null;
 for(const w of f.worlds||[])for(const pl of w.planets){const d=Math.hypot(pl.pos[0]-f.p[0],pl.pos[1]-f.p[1],pl.pos[2]-f.p[2]);if(d<PR(pl.p)+60&&(!near||d<near.d))near={d,w,pl}}
 if(near){if(f.hintP!==near.pl.p){f.hintP=near.pl.p;msg(near.pl.name+': desça devagar (S freia) para entrar na superfície.',2800)}}
 else f.hintP=null;
 for(const w of f.worlds||[])for(const pl of w.planets){const R=PR(pl.p),dx=f.p[0]-pl.pos[0],dy=f.p[1]-pl.pos[1],dz=f.p[2]-pl.pos[2],d=Math.hypot(dx,dy,dz);
  if(d<R){const sp=Math.hypot(f.v[0],f.v[1],f.v[2]);
   if(sp<=ENTRY_SPD){enterPlanet(f,pl.p);return false}
   const k=R/Math.max(d,1e-3);f.p=[pl.pos[0]+dx*k,pl.pos[1]+dy*k,pl.pos[2]+dz*k];
   if(f.bumpP!==pl.p){f.bumpP=pl.p;msg('Muito rápido para entrar em '+pl.name+': freie (S) e desça devagar.',2600)}}}
 return false}

/* ====================================================================

   Todas as telas do jogo usam estas peças.
   ==================================================================== */
const KIT={
 bg:['#0b0610','#1a0a22','#2a0f2e'],        // fundo do espaço (violeta muito escuro)

 faceLight:[255,255,255], faceDark:[0,0,0]};
/* cor facetada: base RGB com luz lambert (0..1) e brilho mínimo */
function kitFace(rgb,lam){const k=.28+.72*Math.max(0,Math.min(1,lam));return`rgb(${Math.round(rgb[0]*k)},${Math.round(rgb[1]*k)},${Math.round(rgb[2]*k)})`}
function kitHex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
/* brilho neon em qualquer elemento desenhado no canvas */
function kitGlow(ctx,color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur||16}
function kitGlowOff(ctx){ctx.shadowBlur=0}
/* moldura hexagonal de cabine (usada em voo, submarino e menus de pilotagem) */
function kitHexFrame(ctx,cx,cy,R,w,h){const hx=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;hx.push([cx+Math.cos(a)*R*1.05,cy+Math.sin(a)*R*.82])}
 ctx.beginPath();ctx.rect(0,0,w,h);ctx.moveTo(hx[0][0],hx[0][1]);for(let i=1;i<6;i++)ctx.lineTo(hx[i][0],hx[i][1]);ctx.closePath();ctx.fillStyle='rgba(16,8,28,.94)';ctx.fill('evenodd');
 ctx.strokeStyle=KIT.metal;ctx.lineWidth=Math.max(8,w/90);ctx.beginPath();for(const p of hx){ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1])}ctx.stroke();
 ctx.lineWidth=3;ctx.beginPath();hx.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();return hx}
/* painel facetado (retângulo de cabine com borda neon) */
function kitPanel(ctx,pts,fill,edge){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill||KIT.redDark;ctx.fill();if(edge){ctx.strokeStyle=edge;ctx.lineWidth=1.5;ctx.stroke()}}

/* ---------- ETAPA 2–3 DO KIT: naves e submarino facetados com a paleta do jogador ---------- */
/* submarino: casco de perfil afilado (anéis ao longo do eixo), torre com janela, vigia, leme, lâmpada na proa e hélice que gira.
   cores da paleta: 0 casco · 1 detalhe (acento) · 2 vidro · 3 luz laranja */
const SUB_N=12;
function subProf(z){const t=(z+12.5)/25;return t<=0||t>=1?0:4.9*Math.pow(Math.sin(Math.PI*t),.62)}

 for(const[a,b2,c2,d2]of[[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[0,3,7,4],[1,2,6,5]]){f.push([base+a,base+b2,base+c2,c]);f.push([base+a,base+c2,base+d2,c])}}

 for(let k=0;k<SUB_N;k++){f.push([apexS,idx(R-1,k),idx(R-1,k+1),0]);f.push([apexN,idx(0,k+1),idx(0,k),0])}
 /* torre com janela frontal, periscópio, leme vertical, aletas laterais e lâmpada na proa */
 subBoxInto(v,f,-1.1,2.3,-1.2,1.1,4.5,2.2,1);
 subBoxInto(v,f,-.9,3.7,2.2,.9,4.2,2.4,2);
 subBoxInto(v,f,-.15,4.5,-.2,.15,6.2,.2,0);
 subBoxInto(v,f,-.15,.5,-12.6,.15,3.4,-9.4,1);
 subBoxInto(v,f,-4.6,-.5,-3,-3.4,.5,3,1);

 subBoxInto(v,f,-.3,-.3,12.3,.3,.3,12.95,3);
 subBoxInto(v,f,-.35,-.35,-12.9,.35,.35,-12.3,3);
 /* vigias: janelas de vidro nos dois lados do casco */
 for(const zc of [-6,-2,2,6]){const r=subProf(zc)-.05;subBoxInto(v,f,r,-.45,zc-.5,r+.22,.45,zc+.5,2);subBoxInto(v,f,-r-.22,-.45,zc-.5,-r,.45,zc+.5,2)}

 subBoxInto(v,f,-.05,4.5,-1.0,.05,7.2,-.9,0);
 subBoxInto(v,f,-.12,7.1,-1.12,.12,7.4,-.78,2);
 subBoxInto(v,f,-.5,4.45,.4,.5,4.62,1.4,0);
 subBoxInto(v,f,-1.22,2.6,-.9,-1.08,3.4,-.84,0);subBoxInto(v,f,1.08,2.6,-.9,1.22,3.4,-.84,0);
 subBoxInto(v,f,-.5,2.0,-6.6,.5,2.4,-5.4,1);subBoxInto(v,f,-.5,2.0,5.4,.5,2.4,6.6,1);
 /* anel protetor em volta da hélice */
 subBoxInto(v,f,-.5,.35,-13.0,.5,.55,-12.2,0);subBoxInto(v,f,-.5,-.55,-13.0,.5,-.35,-12.2,0);subBoxInto(v,f,-.55,-.35,-13.0,-.35,.35,-12.2,0);subBoxInto(v,f,.35,-.35,-13.0,.55,.35,-12.2,0);

/* ---------- controle (gamepad) ----------

const PAD_KEYS=new Set();

let PAD_PREV=[];

  if(ly<-dz)PAD_KEYS.add('w');if(ly>dz)PAD_KEYS.add('s');
  if(rx<-dz)PAD_KEYS.add('arrowleft');if(rx>dz)PAD_KEYS.add('arrowright');
  if(ry<-dz)PAD_KEYS.add('arrowup');if(ry>dz)PAD_KEYS.add('arrowdown');

function hudEdVisivel(){return[...document.querySelectorAll('[data-hk]')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0})}

 const sel=document.createElement('select');const op0=document.createElement('option');op0.textContent='Escolher elemento...';op0.value='';sel.appendChild(op0);
 hudEdVisivel().forEach(e=>{const o=document.createElement('option');o.value=e.dataset.hk;o.textContent=e.dataset.hk;if(e===HED)o.selected=true;sel.appendChild(o)});
 sel.onchange=()=>{const e=document.querySelector('[data-hk]');const k=sel.value;HED=[...document.querySelectorAll('[data-hk]')].find(x=>x.dataset.hk===k)||null;hudEdSel()};bar.appendChild(sel);
 [['Aumentar',()=>hudScale(.1)],['Diminuir',()=>hudScale(-.1)],
  ['Resetar este',()=>{if(!HED){msg('Selecione um botão primeiro',1600);return}delete HUDL[HED.dataset.hk];hudSave();hudApplyAll();hudEdSel()}],

function hudEdPointer(){const ov=$('hudEd');
 ov.onpointerdown=e=>{const hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.dataset&&x.dataset.hk);HED=hit||null;HDRAG=hit?{x:e.clientX,y:e.clientY}:null;hudEdSel()};
 ov.onpointermove=e=>{if(!HDRAG||!HED)return;const k=HED.dataset.hk;const L=HUDL[k]||{x:0,y:0,s:1};L.x+=e.clientX-HDRAG.x;L.y+=e.clientY-HDRAG.y;HDRAG={x:e.clientX,y:e.clientY};HUDL[k]=L;hudApply(HED)};

  S.fuel=S.fuel??100;S.data=S.data??0;S.crystal=S.crystal??0;S.cell=S.cell||{x:0,y:0};
  if(j.uni)UNIVERSE=j.uni;S.visited=Array.isArray(j.visited)?j.visited:[];persistVisited();progDefaults();return true}catch(e){return false}}

 {id:'f_destruidor',n:'Destruidor Estelar',ref:'Cunha gigante de três motores, torre de canhões e ponte alta.',o:{body:'Triângulo',wing:'Nenhuma',eng:'Três motores traseiros',weapon:'Torre',extra:'Ponte alta',size:'Grande',color:10,accent:0,wc:10}}];

{const seen={};BODY_OPTS.forEach(b=>{while(seen[b.hull])b.hull+=4;seen[b.hull]=1})}
